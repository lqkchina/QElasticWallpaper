name: 自动打包 EXE

# 触发条件：
#   - 每次 push 到 main 分支（自动出包，作为 Actions 产物可下载）
#   - 每次打 tag（如 v1.0.0），自动生成 GitHub Release 并把包挂上去
# 版本号来源：src/QElasticWallpaper/QElasticWallpaper.csproj 里的 <Version>xxx</Version>
# 打包方式：.NET 8 自包含、文件夹发布（EXE + DLL 放一起，压成 zip），
# 目标电脑无需安装 .NET 运行库。
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch: {}   # 也支持在 Actions 页面手动触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK（8.0，LTS 长期支持版）
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 从 csproj 读取版本号，供命名 zip 使用
      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path "src/QElasticWallpaper/QElasticWallpaper.csproj" `
                -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          echo "ver=$v" >> $env:GITHUB_OUTPUT

      # 文件夹发布：改用 .NET 8 并自带运行环境（self-contained）。
      # 之前 .NET 7 的 WPF 在你机器上创建窗口报 "DllNotFoundException"，换到
      # .NET 8 LTS 已修复大量此类窗口问题；自包含则无需在电脑上额外装运行库。
      - name: 发布（文件夹形式，.NET 8 自包含，无需装运行库）
        run: |
          dotnet publish "src/QElasticWallpaper/QElasticWallpaper.csproj" `
            -c Release -r win-x64 --self-contained true -o publish

      # 把整个发布文件夹压缩成 zip，便于下载和解压
      - name: 打包成 zip
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/*" `
            -DestinationPath "QElasticWallpaper-${{ steps.ver.outputs.ver }}-win-x64.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: QElasticWallpaper-${{ steps.ver.outputs.ver }}-win-x64
          path: |
            QElasticWallpaper-${{ steps.ver.outputs.ver }}-win-x64.zip
            publish/QElasticWallpaper.exe

      # 只有打了 tag（v1.0.0 之类）才创建 GitHub Release
      - name: 创建 GitHub Release 并挂载 zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: QElasticWallpaper-${{ steps.ver.outputs.ver }}-win-x64.zip
          generate_release_notes: true
